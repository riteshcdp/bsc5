<svg xmlns="http://www.w3.org/2000/svg" width="700" height="220" viewBox="0 0 700 220" role="img" aria-label="Phytochrome Pr Pfr interconversion diagram">
<rect x="40" y="50" width="220" height="100" rx="12" fill="#e8f0e6" stroke="#2f5d3a"/>
<text x="150" y="95" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Pr</text>
<text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="13">Red-absorbing, inactive</text>
<rect x="440" y="50" width="220" height="100" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="550" y="95" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Pfr</text>
